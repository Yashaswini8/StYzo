# Render Blueprint — auto-provisions the web service when you connect
# this repository to Render (New -> Blueprint) or via the dashboard.
#
# The `sync: false` env vars are prompted for at deploy time — fill them
# in with your real Meta WhatsApp Cloud API / Gemini credentials.
services:
  - type: web
    name: styzo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 3000
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: BASE_PRICE
        value: 100
      - key: WEEKEND_SURCHARGE
        value: 25
      - key: PRICING_CURRENCY
        value: USD
      - key: DEFAULT_CITY
        value: Barcelona